name: checks
on: [push, pull_request]
permissions:
  contents: read
env:
  SIGNALHUB_EVIDENCE_DIR: ci-evidence
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TEST_DB_PASSWORD: signalhub-test-fixture
      TEST_DB_URL: jdbc:postgresql://127.0.0.1:55432/signalhub_test
      TEST_DATABASE_URL: postgresql+psycopg://signalhub:signalhub-test-fixture@127.0.0.1:55432/signalhub_test
      AI_PROVIDER: disabled
      AI_PAID_AUTHORIZED: "false"
    services:
      postgres:
        image: postgres:17.11-alpine
        env: {POSTGRES_USER: signalhub, POSTGRES_PASSWORD: signalhub-test-fixture, POSTGRES_DB: signalhub_test}
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U signalhub" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven, cache-dependency-path: backend-java/pom.xml}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --test tests/*.test.cjs
      - run: node --check backend-java/src/main/resources/static/startup.js
      - run: mvn -B -f backend-java/pom.xml verify
      - run: python -m pip install --upgrade 'pip>=26.2'
      - run: python -m pip install -e 'data-pipeline-python[test]'
      - run: cd data-pipeline-python && pytest --junitxml=../ci-evidence/python-junit.xml
      - run: python scripts/evaluate.py
      - run: python scripts/integration_smoke.py
      - run: python scripts/deployment_check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: test-results, path: 'ci-evidence/'}
  container-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --upgrade 'pip>=26.2'
      - run: python -m pip install -e 'data-pipeline-python[test]'
      - run: python scripts/deployment_check.py --docker
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: container-results, path: 'ci-evidence/deployment-check.json'}
