# 独立验收栈：固定_test库、独立端口/卷，不读取.env、不连接正式库。
services:
  db:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: signalhub
      POSTGRES_PASSWORD: signalhub-test-fixture
      POSTGRES_DB: signalhub_test
    ports: ["127.0.0.1:55433:5432"]
    volumes: ["acceptance_pgdata:/var/lib/postgresql/data"]
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signalhub -d signalhub_test"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build: {context: ., dockerfile: backend-java/Dockerfile}
    environment:
      DB_URL: jdbc:postgresql://db:5432/signalhub_test
      DB_USER: signalhub
      DB_PASSWORD: signalhub-test-fixture
      SERVER_ADDRESS: 0.0.0.0
      AI_PROVIDER: disabled
      AI_PAID_AUTHORIZED: "false"
    ports: ["127.0.0.1:18082:8080"]
    mem_limit: 512m
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
  worker:
    build: {context: ., dockerfile: data-pipeline-python/Dockerfile}
    environment:
      DATABASE_URL: postgresql+psycopg://signalhub:signalhub-test-fixture@db:5432/signalhub_test
      AI_PROVIDER: disabled
      AI_PAID_AUTHORIZED: "false"
      RSS_ALLOWED_HOSTS: ""
      GITHUB_TOKEN: ""
    mem_limit: 256m
    depends_on:
      backend: {condition: service_healthy}
volumes:
  acceptance_pgdata:
