<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="csrf" th:content="${csrf}" />
    <meta name="csrf-header" th:content="${csrfHeader}" />
    <title th:text="${title}+' · SignalHub'"></title>
    <link rel="stylesheet" href="/app.css" />
    <script src="/reading.js" defer></script>
    <script src="/app.js" defer></script>
    <script src="/startup.js" defer></script>
  </head>
  <body th:attr="data-section=${section},data-item-id=${itemId}">
    <!-- 默认隐藏：已有会话、脚本失败或禁用 JavaScript 时直接显示原页面。 -->
    <div id="startup-screen" class="startup-screen" role="dialog" aria-modal="true" aria-labelledby="startup-title" hidden>
      <button id="startup-skip" class="startup-skip" type="button">跳过动画</button>
      <div class="startup-identity">
        <svg class="startup-logo" viewBox="0 0 100 100" fill="none" aria-hidden="true">
          <path d="M76 22a38 38 0 1 1-51 0" stroke="currentColor" stroke-width="5" stroke-linecap="round" />
          <path d="M50 25a25 25 0 1 0 25 25" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
        <p id="startup-title" class="startup-brand">SignalHub.</p>
        <p class="startup-tagline">DISCOVER WHAT'S NEXT.</p>
      </div>
      <!-- 仅为品牌动画，不提供虚假的业务加载进度或 progressbar 语义。 -->
      <div class="startup-progress" aria-hidden="true"></div>
    </div>
    <svg
      class="icon-sprite"
      xmlns="http://www.w3.org/2000/svg"
      aria-hidden="true"
    >
      <symbol id="icon-plus" viewBox="0 0 24 24">
        <path d="M5 12h14" />
        <path d="M12 5v14" />
      </symbol>
      <symbol id="icon-play" viewBox="0 0 24 24">
        <polygon points="6 3 20 12 6 21 6 3" />
      </symbol>
      <symbol id="icon-refresh-cw" viewBox="0 0 24 24">
        <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
        <path d="M21 3v5h-5" />
        <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
        <path d="M8 16H3v5" />
      </symbol>
      <symbol id="icon-external-link" viewBox="0 0 24 24">
        <path d="M15 3h6v6" />
        <path d="M10 14 21 3" />
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
      </symbol>
      <symbol id="icon-chevron-down" viewBox="0 0 24 24">
        <path d="m6 9 6 6 6-6" />
      </symbol>
      <symbol id="icon-circle-alert" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10" />
        <line x1="12" x2="12" y1="8" y2="12" />
        <line x1="12" x2="12.01" y1="16" y2="16" />
      </symbol>
    </svg>
    <a class="skip-link" href="#content">跳到主要内容</a>
    <div class="publication">
      <header class="masthead">
        <a class="brand" href="/" aria-label="SignalHub 总览"
          >SignalHub<span class="brand-mark">.</span></a
        >
        <div class="masthead-meta">
          <label class="reading-control">阅读模式
            <select id="reading-mode" aria-label="阅读模式">
              <option value="zh">中文优先</option>
              <option value="original">原文优先</option>
              <option value="bilingual">双语对照</option>
            </select>
          </label>
          <time id="edition-date"></time
          ><span class="local-space"
            ><span class="local-dot" aria-hidden="true"></span
            >本地单用户空间</span
          >
        </div>
      </header>
      <nav class="publication-nav" aria-label="主导航">
        <a class="nav-link" href="/" data-nav="overview">总览</a
        ><a class="nav-link" href="/view/domestic" data-nav="domestic"
          >国内求职</a
        ><a class="nav-link" href="/view/foreign" data-nav="foreign">外企求职</a
        ><a class="nav-link" href="/view/opportunities" data-nav="opportunities"
          >海外机会</a
        ><a class="nav-link" href="/view/technology" data-nav="technology"
          >技术情报</a
        ><a class="nav-link" href="/view/skills" data-nav="skills"
          >JD 技能分析</a
        ><a class="nav-link" href="/view/subscriptions" data-nav="subscriptions"
          >我的订阅</a
        ><a class="nav-link" href="/view/applications" data-nav="applications"
          >投递管理</a
        ><a class="nav-link" href="/view/monitor" data-nav="monitor"
          >数据源与任务</a
        ><a class="nav-link" href="/view/settings" data-nav="settings"
          >求职档案与设置</a
        >
      </nav>
      <main>
        <header class="page-header">
          <div class="heading-group">
            <p class="section-label" id="section-label">管理</p>
            <h1 th:text="${title}">总览</h1>
            <p class="intro" id="intro">
              以来源证据为依据，让每一次筛选都有解释。
            </p>
          </div>
          <div class="header-actions">
            <label class="switch-control"
              ><span>显示合成演示数据</span
              ><input type="checkbox" role="switch" id="include-demo" /><span
                class="switch-track"
                aria-hidden="true"
              ></span></label
            ><a class="btn btn-primary btn-import" href="/view/import"
              ><svg class="icon" aria-hidden="true">
                <use href="#icon-plus"></use></svg
              ><span>导入信息</span></a
            >
          </div>
        </header>
        <div id="notice" class="notice" role="status" hidden></div>
        <div id="reading-tools" class="reading-tools" hidden>
          <button id="translate-visible" type="button" class="btn btn-secondary">翻译当前页 / 检查 · 本地免费</button>
          <span id="translation-progress" class="muted" role="status"></span>
        </div>
        <section id="content" tabindex="-1" aria-live="polite">
          <div class="empty loading" role="status"><span>加载中…</span></div>
        </section>
      </main>
      <footer>付费 AI 默认关闭 · 个人信息本地保存
        <button th:if="${startupReplay}" id="startup-replay" class="startup-replay" type="button">重播启动动画</button>
      </footer>
    </div>
  </body>
</html>
